<!DOCTYPE html>
<html
        xmlns:th="https://thymeleaf.org/"
        xmlns:layout="https://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <!-- Meta tags Obrigatórias -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">

    <title>Cadastro de estados</title>
</head>
<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTxkSFHI1crKhMbo_giG8iW3Y7dzQDVKgw1ydb8FDYA5w&s=10" alt="" width="30" height="24" class="d-inline-block align-text-top">

    <div class="container-fluid">
        <a class="navbar-brand" href="#">FoxFlow</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#conteudoNavbarSuportado" aria-controls="conteudoNavbarSuportado" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="conteudoNavbarSuportado">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item active">
                    <a class="nav-link" href="#">Home <span class="sr-only">(página atual)</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Link</a>
                </li>


            </ul>
            <form class="form-inline my-2 my-lg-0">
                <input class="form-control mr-sm-2" type="search" placeholder="Pesquisar" aria-label="Pesquisar">
                <button class="btn btn-outline-ligth my-2 my-sm-0" type="submit">Pesquisar</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">

    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
        <span th:text="${sucesso}">Mensagem de sucesso</span>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
        <span th:text="${erro}">Mensagem de erro</span>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <form action="/salvarEstado" th:object="${estado}" method="post">
        <div class="form-group">

            <label for="id">ID</label>
            <input type="text" readonly="true" class="form-control" id="id" th:field="*{id}">
            <small id="emailHelp1" class="form-text text-muted">Ex.: Pernambuco</small>

            <label for="nome">Nome do Estado</label>
            <input type="text" class="form-control" id="nome" th:field="*{nome}">
            <small id="emailHelp2" class="form-text text-muted">Ex.: Pernambuco</small>

            <label for="sigla">Sigla do Estado</label>
            <input type="text" class="form-control" id="sigla" th:field="*{sigla}">
            <small id="emailHelp3" class="form-text text-muted">Ex.: PE</small>

        </div>


        <button type="submit" class="btn btn-dark">Salvar</button>
        <a href="/adm" class="btn btn-danger">Voltar</a>
    </form>
</div>


<!-- JavaScript (Opcional) -->
<!-- jQuery primeiro, depois Popper.js, depois Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"
        integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"
        integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
</body>
</html>
